name: QA Framework Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  example_test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Create .env file
        run: |
          cat > .env <<EOF
          TODOMVC_URL=${{ secrets.TODOMVC_URL }}
          JSONPLACEHOLDER_URL=${{ secrets.JSONPLACEHOLDER_URL }}
          SELENIUM_PRACTISE_URL=${{ secrets.SELENIUM_PRACTISE_URL }}
          SELENIUM_PRACTICE2_URL=${{ secrets.SELENIUM_PRACTICE2_URL }}
          EOF

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: reports/allure-results

      - name: Install Allure
        if: always()
        run: |
          wget -O allure.tgz https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz
          tar -zxvf allure.tgz
          sudo mv allure-2.32.0 /opt/allure
          echo "/opt/allure/bin" >> $GITHUB_PATH

      - name: generate Allure Report
        if: always()
        run: uv run allure generate reports/allure-results --clean -o reports/allure-report

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/allure-report
          destination_dir: smoke
