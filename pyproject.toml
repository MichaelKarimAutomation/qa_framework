[project]
name = "qa-framework"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "allure-pytest>=2.15.3",
    "factory-boy>=3.3.3",
    "faker>=40.15.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "locust>=2.43.4",
    "playwright>=1.58.0",
    "plyer>=2.1.0",
    "pytest>=9.0.3",
    "pytest-dotenv>=0.5.2",
    "pytest-httpserver>=1.1.5",
    "pytest-playwright>=0.7.2",
    "pytest-rerunfailures>=16.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.11",
    "sphinx>=8.0.0",
    "sphinx-rtd-theme>=3.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
reruns = 0
reruns_delay = 1
addopts = "--alluredir=reports/allure-results --tracing=retain-on-failure"
markers = [
    "ui: marks tests as UI tests",
    "api: marks tests as API tests",
    "smoke: marks tests as smoke tests",
    "regression: marks tests as regression tests",
]

[tool.ruff]
line-length = 150

[tool.ruff.format]
quote-style = "single"
